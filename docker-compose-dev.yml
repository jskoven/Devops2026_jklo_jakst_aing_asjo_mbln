version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=minitwit_admin
      - POSTGRES_PASSWORD=12345
      - POSTGRES_DB=minitwit_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minitwit_admin -d minitwit_dev"]
      interval: 3s
      timeout: 3s
      retries: 5

  minitwit:
    build: .
    ports:
      - "8080:5001"
    environment:
      - DATABASE_URL=postgresql://minitwit_admin:12345@db:5432/minitwit_dev
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dev-network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - dev-network

  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge
    
volumes:
  postgres_dev_data: {}